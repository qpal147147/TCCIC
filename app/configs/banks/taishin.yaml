bank_code: taishin
bank_name: 台新銀行
is_dynamic: False
xpaths:
  # This field is used to retrieve information from each card in the list:
  # tab_link (str): Used to locate the tab section that categorizes cards on the page.
  #                 For example, if the page contains tabbed categories, this parameter is used to capture the link for each tab and automatically navigate to the corresponding URL.
  #                 If the webpage is static, it should capture the link; otherwise, it should capture the entire content block.
  #                 If the webpage does not have a tab section, set this value to null or leave it empty.
  # skip_card_tabs (list[dict[str, str]]): List of tab names and their corresponding URLs to skip.
  #                                        Each dictionary contains two keys: "name" and "url".
  # division (str): Used to locate the area on the page where each card is situated.
  # card (str): Used to extract the title and url of each card. If the url is the same as the tab_link, set its value to the string "tab_url".
  tab_link: //ul[@class="nav nav-tabs  tab-sty-1"]/li/a/@href
  division: .//li[@class="ul-li-items" and @itemprop="itemListElement"]
  card:
    title: .//p[@itemprop="name"]/text()
    url: .//a[@itemprop="url"]/@href

# Bank-level default cookie button selector applied to all cards.
# Override per-card by setting cookie_button inside a features entry.
cookie_button: //button[contains(@class, 'cookie')]

features:
  # Each entry defines crawl rules for one card URL pattern.
  #
  # - card_code (str): Matched as a substring of the card URL to select which rule set applies.
  # - cookie_button (str|null): Per-card override for the cookie-consent button selector.
  #                             Leave null to inherit the bank-level cookie_button above.
  # - focus (list): Ordered list of page regions to interact with.
  #   - content (str): XPath of the region to screenshot and parse links from.
  #   - link (str): XPath of clickable links within that region.
  #   - popup (object|null): Set only if clicking a link in this region opens an in-page popup
  #                          (i.e. the URL does not change and no new browser tab opens).
  #                          Omit this field entirely when no popup is expected.
  #     Example:
  #       popup:
  #         content: //div[@class="modal-body"]   # XPath of the popup area to screenshot
  #         close_button: //button[@class="close"] # Selector to close the popup afterwards
  #
  - card_code: cg047
    cookie_button:
    focus:
      - content: //div[@class="ts-comp-40-1 no-border-bottom"]
        link: .//a
      - content: //div[@id="ts-comp-41-collapse-2"]
        link: .//a
      - content: //div[@id="ts-comp-41-collapse-3"]
        link: .//a

